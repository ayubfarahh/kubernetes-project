repositories:
- name: external-dns
  url: https://kubernetes-sigs.github.io/external-dns/
- name: traefik
  url: https://traefik.github.io/charts

releases:
- name: external-dns
  namespace: external-dns
  chart: external-dns/external-dns
  version: v1.20.0
  values:
  - serviceAccount:
      create: true
      name: external-dns-sa
    provider: aws
    aws:
      region: eu-west-2
    domainFilters:
    - ayubs.uk

- name: traefik
  namespace: traefik
  chart: traefik/traefik
  version: 38.0.2
  values:
  - service: 
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: nlb
    ports:
      web:
        port: 80
        exposedPort: 80
