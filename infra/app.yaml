apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-deployment
  labels:
    app: game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game
  template:
    metadata:
      labels:
        app: game
    spec:
      containers:
      - name: game-image
        image: 940622738555.dkr.ecr.eu-west-2.amazonaws.com/eks-v3:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: game-service
spec:
  selector:
      app: game
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
